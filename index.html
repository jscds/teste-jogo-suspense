<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <title>Meu Jogo de Suspense - Puzzle</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.min.js"></script>
    <style>
        body { margin: 0; background: #000; }
        canvas { display: block; margin: 0 auto; }
    </style>
</head>
<body>
    <script>
        const config = {
            type: Phaser.AUTO,
            width: 800,
            height: 600,
            physics: {
                default: 'arcade',
                arcade: { gravity: { y: 0 }, debug: false }
            },
            scene: {
                preload: preload,
                create: create,
                update: update
            }
        };

        const game = new Phaser.Game(config);

        let player;

        function preload() {
            // Aqui você vai carregar imagens e sons depois
            this.load.image('player', 'https://labs.phaser.io/assets/sprites/phaser-dude.png');
            this.load.image('wall', 'https://labs.phaser.io/assets/sprites/platform.png');
        }

        function create() {
            this.cameras.main.setBackgroundColor('#1a0033'); // fundo escuro roxo (suspense)

            player = this.physics.add.sprite(100, 450, 'player');
            player.setCollideWorldBounds(true);

            // Controles
            this.cursors = this.input.keyboard.createCursorKeys();

            // Texto de exemplo
            this.add.text(200, 100, 'Bem-vindo ao Jogo de Suspense', {
                fontSize: '28px',
                fill: '#ff3333'
            }).setShadow(2, 2, '#000', 5);
        }

        function update() {
            if (!player) return;

            player.setVelocityX(0);

            if (this.cursors.left.isDown) player.setVelocityX(-200);
            if (this.cursors.right.isDown) player.setVelocityX(200);
            if (this.cursors.up.isDown) player.setVelocityY(-200);
            if (this.cursors.down.isDown) player.setVelocityY(200);
            if (this.none) player.setVelocityX(0)
            if (this.none) player.setVelocityY(0)
        }
    </script>
</body>
</html>
